app:
  name: "RePurpose.ai API"
  slug_name: "re-purpose-be"
  version: "1.0.0"
build: "1"
mode: "dev"
port: "8080"
log_level: "debug"
log_format: "text"

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

# Set to "memory" to run the whole API without PostgreSQL (useful for local scaffolding).
# Use "postgres" together with the credentials below for a real database.
db:
  driver: "memory" # memory | postgres
  host: "127.0.0.1"
  port: "5432"
  name: "repurpose"
  user: "repurpose"
  password: "repurpose"
  timezone: "Asia/Jakarta"
  ssl_mode: "disable"
  max_idle_conns: 10
  max_open_conns: 50
  conn_max_lifetime: "15m"
  conn_max_idletime: "10m"
  retry_attempts: 3
  ping_interval: "5s"

enable_caching: false
cache_ttl: "15m"

redis:
  cache_host: "redis://127.0.0.1:6379/0"
  worker_host: "redis://127.0.0.1:6379/1"
  retry_attempts: 3
  dial_timeout: "5s"
  write_timeout: "5s"
  read_timeout: "5s"
  max_idle_conn: 50
  max_active_conn: 100

worker:
  namespace: "repurpose-be"
  port: "4011"
  concurrency: 10
  retry_attempts: 3
  retry_delay: "1m"
  timeout: "5m"

auth:
  # Local/dev convenience: every request is treated as the demo user.
  # Set to false in production and configure auth.jwt.secret.
  bypass: true
  demo_user_id: "usr_demo"
  bcrypt_cost: 12
  jwt:
    secret: "change-me-in-production"
    iss: "repurpose-ai"
    access_ttl: "15m"
  refresh:
    ttl: "720h" # remember = true (30 days)
    ttl_short: "24h" # remember = false
  rate_limit:
    requests: 30
    window: "1m"
  google:
    # Google Identity Services client ID (web). Required for POST /auth/google.
    client_id: ""
    client_secret: ""
    redirect_url: "http://localhost:8080/api/v1/auth/google/callback"
    allowed_redirects:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"

# LLM engine. provider: "mock" | "openai".
# The OpenAI provider is compatible with any OpenAI-compatible endpoint
# (OpenAI, Azure-compatible gateways, OpenRouter, Ollama, etc.).
llm:
  provider: "mock"
  base_url: "https://api.openai.com/v1"
  api_key: ""
  model: "gpt-4o-mini"
  timeout: "120s"

extractor:
  timeout: "15s"
  max_content_length: 200000
