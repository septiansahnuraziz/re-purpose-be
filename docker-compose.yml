services:
  postgres:
    image: postgres:17-alpine
    container_name: repurpose-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: repurpose
      POSTGRES_USER: repurpose
      POSTGRES_PASSWORD: repurpose
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repurpose -d repurpose"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: repurpose-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repurpose-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MODE: dev
      PORT: "8080"
      LOG_LEVEL: debug
      LOG_FORMAT: text
      TZ: Asia/Jakarta
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: repurpose
      DB_USER: repurpose
      DB_PASSWORD: repurpose
      DB_TIMEZONE: Asia/Jakarta
      DB_SSL_MODE: disable
      ENABLE_CACHING: "true"
      REDIS_CACHE_HOST: redis://redis:6379/0
      REDIS_WORKER_HOST: redis://redis:6379/1
      AUTH_BYPASS: "true"
      AUTH_DEMO_USER_ID: usr_demo
      AUTH_JWT_SECRET: change-me-in-production
      AUTH_JWT_ISS: repurpose-ai
      AUTH_JWT_ACCESS_TTL: 15m
      AUTH_REFRESH_TTL: 720h
      AUTH_REFRESH_TTL_SHORT: 24h
      AUTH_GOOGLE_CLIENT_ID: ""
      LLM_PROVIDER: mock
      LLM_MODEL: gpt-4o-mini
      LLM_TIMEOUT: 120s
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: repurpose-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      MODE: dev
      LOG_LEVEL: debug
      LOG_FORMAT: text
      TZ: Asia/Jakarta
      REDIS_WORKER_HOST: redis://redis:6379/1
      WORKER_CONCURRENCY: "10"
      LLM_PROVIDER: mock
      LLM_MODEL: gpt-4o-mini
      LLM_TIMEOUT: 120s

volumes:
  postgres_data:
  redis_data:
