app:
  name: "RePurpose.ai API"
  slug_name: "re-purpose-be"
  version: "1.0.0"
build: "1"
mode: "prod"
port: "8080"
log_level: "info"
log_format: "json"

cors:
  allowed_origins:
    - "https://repurpose.ai"

db:
  driver: "postgres"
  host: "postgres"
  port: "5432"
  name: "repurpose"
  user: "repurpose"
  password: "change-me"
  timezone: "Asia/Jakarta"
  ssl_mode: "disable"
  max_idle_conns: 20
  max_open_conns: 100
  conn_max_lifetime: "15m"
  conn_max_idletime: "10m"
  retry_attempts: 3
  ping_interval: "5s"

enable_caching: true
cache_ttl: "15m"

redis:
  cache_host: "redis://redis:6379/0"
  worker_host: "redis://redis:6379/1"
  retry_attempts: 3
  dial_timeout: "5s"
  write_timeout: "5s"
  read_timeout: "5s"
  max_idle_conn: 50
  max_active_conn: 100

worker:
  namespace: "repurpose-be"
  port: "4011"
  concurrency: 20
  retry_attempts: 3
  retry_delay: "1m"
  timeout: "5m"

auth:
  bypass: false
  demo_user_id: "usr_demo"
  bcrypt_cost: 12
  jwt:
    secret: "change-me-in-production"
    iss: "repurpose-ai"
    access_ttl: "15m"
  refresh:
    ttl: "720h"
    ttl_short: "24h"
  rate_limit:
    requests: 30
    window: "1m"
  google:
    client_id: ""
    client_secret: ""
    redirect_url: "https://api.repurpose.ai/api/v1/auth/google/callback"
    allowed_redirects:
      - "https://repurpose.ai"

llm:
  provider: "openai"
  base_url: "https://api.openai.com/v1"
  api_key: ""
  model: "gpt-4o-mini"
  timeout: "120s"

extractor:
  timeout: "15s"
  max_content_length: 200000
